<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staffora - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- common css (same as login page) -->
    <link rel="stylesheet" href="style.css">
    <!-- sign up page css (only extra things) -->
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- Outer div: page wrapper (centers the card) -->
    <div class="login-page">

        <!-- Inner div: sign up card -->
        <div class="login-card">

            <!-- Left: form -->
            <div class="form-side">
                <div class="form-wrap">

                    <div class="brand">
                        <span class="brand-icon"><i class="bi bi-fire"></i></span>
                        <span class="brand-name">HCM Lite</span>
                    </div>

                    <h2 class="welcome">Create Account</h2>
                    <p class="subtitle">Set up your company to get started</p>

                    <form id="signupForm">

                        <!-- Company Information -->
                        <h3 class="section-title">Company Information</h3>

                        <div class="mb-3">
                            <label for="companyName" class="form-label">Company Name <span class="req">*</span></label>
                            <input type="text" class="form-control" id="companyName"
                                placeholder="Enter your company name">
                        </div>

                        <!-- Admin Account Information -->
                        <h3 class="section-title second">Admin Account Information</h3>

                        <div class="mb-3">
                            <label for="adminName" class="form-label">Admin Full Name <span class="req">*</span></label>
                            <input type="text" class="form-control" id="adminName" placeholder="Enter your full name">
                        </div>

                        <div class="mb-3">
                            <label for="adminEmail" class="form-label">Admin Email <span class="req">*</span></label>
                            <input type="email" class="form-control" id="adminEmail" placeholder="admin@company.com">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password <span class="req">*</span></label>
                            <div class="pw-group">
                                <input type="password" class="form-control" id="password"
                                    placeholder="Create a password">
                                <button type="button" class="pw-toggle">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm Password <span
                                    class="req">*</span></label>
                            <div class="pw-group">
                                <input type="password" class="form-control" id="confirmPassword"
                                    placeholder="Confirm your password">
                                <button type="button" class="pw-toggle">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-signin">Create Account</button>
                    </form>

                    <p class="footer-note">
                        Already have an account? <a href="index.html" class="link-orange">Sign in</a>
                    </p>

                </div>
            </div>

            <!-- Right: photo -->
            <div class="hero">
                <h1>Manage Your Team<br>with Clarity</h1>
                <p>Staffora helps you streamline employee management and daily HR operations in one place.</p>
            </div>

        </div>

    </div>

</body>

</html>
