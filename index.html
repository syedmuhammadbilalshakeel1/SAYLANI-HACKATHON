<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staffora - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
   <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
            <!-- font awsome for font -->
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
                integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
                crossorigin="anonymous" referrerpolicy="no-referrer" />
            <!-- bootsrap link forcss -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
                integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Outer div: page wrapper (centers the card) -->
    <div class="login-page">

        <!-- Inner div: login card -->
        <div class="login-card">

            <!-- Left: photo -->
            <div class="hero">
                <h1>Manage Your Team<br>with Clarity</h1>
                <p>Staffora helps you streamline employee management and daily HR operations in one place.</p>
            </div>

            <!-- Right: form -->
            <div class="form-side">
                <div class="form-wrap">

                    <div class="brand">
                        <span class="brand-icon"><i class="bi bi-fire"></i></span>
                        <span class="brand-name">HCM Lite</span>
                    </div>

                    <h2 class="welcome">Welcome Back</h2>
                    <p class="subtitle">Please enter your details to continue</p>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="youremail@company.com">
                        </div>

                        <div class="mb-3">
                            <label for="company" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="company" placeholder="Enter your company name">
                        </div>

                        <div>
                            <label for="password" class="form-label">Password</label>
                            <div class="pw-group">
                                <input type="password" class="form-control" id="password"
                                    placeholder="Enter your password">
                                <button type="button" class="pw-toggle" id="togglePw">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="options">
                            <div>
                                <input type="checkbox" id="remember">
                                <label for="remember">Remember me</label>
                            </div>
                            <a href="#" class="link-orange">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn btn-signin">Sign In</button>

                        <div class="or">Or</div>

                        <button type="button" class="btn btn-google">
                            <svg viewBox="0 0 48 48">
                                <path fill="#EA4335"
                                    d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z" />
                                <path fill="#4285F4"
                                    d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z" />
                                <path fill="#FBBC05"
                                    d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z" />
                                <path fill="#34A853"
                                    d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z" />
                            </svg>
                            Continue with Google
                        </button>
                    </form>

                    <p class="footer-note">
                        Don't have an account? <a href="#" class="link-orange">Sign up as a company setup</a>
                    </p>

                </div>
            </div>

        </div>

    </div>

</body>

</html>
